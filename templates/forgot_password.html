<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedRAG | Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }
    .top-bar {
        width: 100%;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 24px; color: #0f172a; }
    .logo-icon { font-size: 28px; }
    
    .auth-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        width: 100%;
    }
    .auth-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01), 0 0 0 1px rgba(0,0,0,0.05);
        width: 100%;
        max-width: 440px;
        box-sizing: border-box;
        text-align: center;
    }
    h1 { margin: 0 0 10px 0; color: #0f172a; font-size: 28px; font-weight: 700; }
    p { color: #64748b; font-size: 15px; line-height: 1.5; margin: 0 0 30px 0; }
    
    .form-group { text-align: left; margin-bottom: 25px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; }
    .form-group input { 
        width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; 
        font-size: 15px; box-sizing: border-box; outline: none; transition: border 0.2s, box-shadow 0.2s;
        font-family: 'Inter', sans-serif;
    }
    .form-group input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
    
    .auth-btn {
        width: 100%; padding: 14px; background: #0ea5e9; color: white; border: none; 
        border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        font-family: 'Inter', sans-serif;
    }
    .auth-btn:hover { background: #0284c7; }
    
    .divider { margin: 30px 0; height: 1px; background: #e2e8f0; }
    .register { font-size: 14px; color: #64748b; margin: 0; }
    .register a { color: #0ea5e9; font-weight: 600; text-decoration: none; }
    .register a:hover { text-decoration: underline; }
    
    .footer { padding: 30px; display: flex; gap: 20px; font-size: 13px; color: #94a3b8; width: 100%; box-sizing: border-box;}
    .footer a { color: #94a3b8; text-decoration: none; }
    .footer a:hover { color: #64748b; }
  </style>
</head>
<body>

<header class="top-bar">
  <div class="logo">
      <span class="logo-icon">🩺</span>
      <span class="logo-text">MedRAG</span>
  </div>
  <div style="color:#0ea5e9;font-weight:600; font-size: 14px;">
      HIPAA & DPDP Act Compliant
  </div>
</header>

<div class="auth-container">
  <div class="auth-card">
    <div style="width: 56px; height: 56px; background: #f0f9ff; color: #0ea5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; font-size: 24px;">🔒</div>
    <h1>Reset Password</h1>
    <p>Enter your patient email address to receive a secure password reset link.</p>

    {% if success %}
      <div style="background:#dcfce7; color:#166534; padding:12px; border-radius:8px; margin-bottom:25px; border:1px solid #bbf7d0; font-size:14px; text-align: left; display: flex; gap: 10px; align-items: flex-start;">
        <span style="font-size: 18px;">✅</span>
        <span>{{ success }}</span>
      </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <button type="submit" class="auth-btn">Send Reset Link</button>
    </form>

    <div class="divider"></div>

    <p class="register">
      Remember your password?
      <a href="/login">Return to Login</a>
    </p>
  </div>
</div>

<footer class="footer">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Contact Support</a>
    <span style="margin-left:auto;">© 2026 MedRAG AI Systems</span>
</footer>

</body>
</html>
